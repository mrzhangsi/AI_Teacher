[project]
name = "ai-teacher"
version = "0.1.0"
description = "学习状态监控与提醒：定期截屏+摄像头拍照，判断是否在学习"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mss>=10.2.0",
    "opencv-python-headless<5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.2",
]

[project.scripts]
ai-teacher = "ai_teacher.cli:main"
ai-teacher-gui = "ai_teacher.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["ai_teacher"]
